<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STREAMGUARD — Проверка ключа потока</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #060911;
      --card-bg: #070c16;
      --input-bg: #090f1a;
      --yellow: #f6c927;
      --yellow-border: rgba(246, 201, 39, 0.45);
      --cyan: #00d2ff;
      --cyan-border: rgba(0, 210, 255, 0.4);
      --cyan-bg: rgba(0, 210, 255, 0.03);
      --text-white: #ffffff;
      --text-muted: #8492a6;
      --text-dark: #000000;
      --border-dark: #162032;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: 'Exo 2', 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      /* Тонкая сетка киберпанк-фона */
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        radial-gradient(circle at 50% 35%, #0e1726 0%, #060911 80%);
      background-size: 70px 70px, 70px 70px, 100% 100%;
    }

    /* Фоновое тонкое свечение */
    body::before {
      content: '';
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(16, 30, 51, 0.6) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Верхняя панель (Header) */
    .header {
      width: 100%;
      max-width: 1440px;
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      height: 46px;
      width: auto;
      object-fit: contain;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text-white);
      text-transform: uppercase;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .lang-btn {
      background: #090f1a;
      border: 1px solid var(--border-dark);
      border-radius: 6px;
      color: #cbd5e1;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn:hover {
      border-color: var(--yellow);
      color: #ffffff;
      background: #111a28;
    }

    .globe-icon {
      width: 16px;
      height: 16px;
      stroke: var(--yellow);
    }

    /* Основной контент */
    .main-container {
      width: 100%;
      max-width: 820px;
      padding: 44px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 5;
      margin: auto 0;
    }

    .title {
      font-size: 46px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-white);
      text-align: center;
      margin-bottom: 16px;
    }

    .yellow-divider {
      width: 64px;
      height: 5px;
      background-color: var(--yellow);
      border-radius: 2px;
      margin-bottom: 24px;
    }

    .subtitle {
      font-size: 17px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 44px;
      letter-spacing: 0.2px;
    }

    /* Главный интерактивный блок с уголками */
    .tech-box {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--yellow-border);
      position: relative;
      padding: 46px 42px 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    /* Декоративные скосы/уголки */
    .corner-tick {
      position: absolute;
      width: 9px;
      height: 9px;
      pointer-events: none;
    }

    .corner-tl {
      top: 4px;
      left: 4px;
      border-top: 2px solid var(--yellow);
      border-left: 2px solid var(--yellow);
    }
    .corner-tl::after {
      content: '';
      position: absolute;
      top: -2px;
      left: 1px;
      width: 8px;
      height: 1px;
      background: var(--yellow);
      transform: rotate(45deg);
      transform-origin: top left;
    }

    .corner-tr {
      top: 4px;
      right: 4px;
      border-top: 2px solid var(--yellow);
      border-right: 2px solid var(--yellow);
    }
    .corner-tr::after {
      content: '';
      position: absolute;
      top: -2px;
      right: 1px;
      width: 8px;
      height: 1px;
      background: var(--yellow);
      transform: rotate(-45deg);
      transform-origin: top right;
    }

    .corner-bl {
      bottom: 4px;
      left: 4px;
      border-bottom: 2px solid var(--yellow);
      border-left: 2px solid var(--yellow);
    }
    .corner-bl::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 1px;
      width: 8px;
      height: 1px;
      background: var(--yellow);
      transform: rotate(-45deg);
      transform-origin: bottom left;
    }

    .corner-br {
      bottom: 4px;
      right: 4px;
      border-bottom: 2px solid var(--yellow);
      border-right: 2px solid var(--yellow);
    }
    .corner-br::after {
      content: '';
      position: absolute;
      bottom: -2px;
      right: 1px;
      width: 8px;
      height: 1px;
      background: var(--yellow);
      transform: rotate(45deg);
      transform-origin: bottom right;
    }

    /* Поле ввода */
    .input-field {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-dark);
      border-radius: 6px;
      padding: 19px 22px;
      color: #ffffff;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      margin-bottom: 22px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-field::placeholder {
      color: #718096;
    }

    .input-field:focus {
      border-color: rgba(246, 201, 39, 0.6);
      box-shadow: 0 0 10px rgba(246, 201, 39, 0.15);
    }

    /* Основная кнопка */
    .submit-button {
      width: 100%;
      background-color: var(--yellow);
      color: var(--text-dark);
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      padding: 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
      margin-bottom: 24px;
    }

    .submit-button:hover {
      background-color: #ffd84d;
      box-shadow: 0 0 15px rgba(246, 201, 39, 0.35);
    }

    .submit-button:active {
      transform: scale(0.99);
    }

    /* Подпись под кнопкой */
    .security-note {
      font-size: 14px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .security-note .dot {
      color: #64748b;
      font-size: 16px;
    }

    /* Сетка 3-х преимуществ */
    .features-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-top: 18px;
    }

    .feature-card {
      background: #070c16;
      border: 1px solid var(--border-dark);
      padding: 15px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      color: #e2e8f0;
      transition: border-color 0.2s;
    }

    .feature-card svg {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
    }

    .feature-card.secure {
      border-color: var(--cyan-border);
      background: var(--cyan-bg);
    }

    .icon-yellow {
      stroke: var(--yellow);
    }

    .icon-cyan {
      stroke: var(--cyan);
    }

    /* Блок результата */
    .result-box {
      width: 100%;
      margin-top: 24px;
      border: 1px solid var(--yellow-border);
      background: #070c16;
      padding: 22px 26px;
      text-align: center;
      font-size: 16px;
      color: #8492a6;
      letter-spacing: 0.3px;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    /* Подвал (Footer) */
    .footer {
      width: 100%;
      padding: 24px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      color: #627288;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      position: relative;
      z-index: 10;
      letter-spacing: 0.5px;
    }

    /* Статус API в шапке */
    .api-status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    .api-dot {
      width: 10px;
      height: 10px;
      background: #00ff85;
      border-radius: 50%;
      box-shadow: 0 0 12px 2px #00ff85;
    }

    .api-ping {
      color: #64748b;
      font-weight: 500;
      margin-left: 2px;
    }

    /* Выбор платформы */
    .platforms-list {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-bottom: 24px;
    }

    .platform-chip {
      flex: 1;
      background: #0b1320;
      border: 1px solid #1a273b;
      border-radius: 9999px;
      color: #94a3b8;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      font-family: inherit;
    }

    .platform-chip:hover {
      border-color: #334866;
      color: #e2e8f0;
    }

    .platform-chip.active {
      border-color: var(--yellow);
      color: #ffffff;
      background: #111a28;
      box-shadow: 0 0 10px rgba(246, 201, 39, 0.2);
    }

    .platform-chip img {
      width: 30px;
      height: 30px;
      object-fit: contain;
      display: inline-block;
      flex-shrink: 0;
    }

    /* Контейнер ввода с кнопкой вставки */
    .input-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 22px;
    }

    .input-wrapper .input-field {
      margin-bottom: 0;
      padding-right: 125px;
    }

    .paste-btn {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      background: #0d1522;
      border: 1px solid #23344d;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      padding: 9px 15px;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .paste-btn:hover {
      border-color: var(--yellow);
      background-color: #142033;
    }

    /* Адаптивность для мобильных */
    @media (max-width: 768px) {
      .header {
        padding: 16px 20px;
      }
      .header-right {
        gap: 10px;
      }
      .title {
        font-size: 32px;
      }
      .subtitle {
        font-size: 14px;
        margin-bottom: 28px;
      }
      .tech-box {
        padding: 26px 18px 20px;
      }
      .platforms-list {
        flex-wrap: wrap;
        gap: 8px;
      }
      .platform-chip {
        font-size: 13px;
        padding: 9px 12px;
      }
      .platform-chip img {
        width: 24px;
        height: 24px;
      }
    }
  </style>
</head>
<body>

  <!-- Хедер сайта -->
  <header class="header">
    <div class="brand">
      <img src="logo.png" alt="STREAMGUARD" class="brand-logo">
      <span class="brand-name">STREAMGUARD</span>
    </div>

    <div class="header-right">
      <div class="api-status">
        <span class="api-dot"></span>
        <span>API ONLINE</span>
        <span class="api-ping" id="apiPing">18ms</span>
      </div>

      <button type="button" class="lang-btn" id="langBtn" title="Сменить язык / Switch language">
        <svg class="globe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span id="langCode">RU</span>
      </button>
    </div>
  </header>

  <!-- Основная рабочая область -->
  <main class="main-container">
    <h1 class="title" id="mainTitle">Проверка ключа потока</h1>
    <div class="yellow-divider"></div>
    <p class="subtitle" id="mainSubtitle">Вставьте ключ потока и проверьте легитимность</p>

    <!-- Главная плашка ввода -->
    <div class="tech-box">
      <!-- Кибернетические уголки -->
      <div class="corner-tick corner-tl"></div>
      <div class="corner-tick corner-tr"></div>
      <div class="corner-tick corner-bl"></div>
      <div class="corner-tick corner-br"></div>

      <!-- Выбор платформы -->
      <div class="platforms-list" id="platformSelector">
        <button type="button" class="platform-chip">
          <img src="twitch.png" alt="Twitch">
          Twitch
        </button>
        <button type="button" class="platform-chip active">
          <img src="youtube.png" alt="YouTube">
          YouTube
        </button>
        <button type="button" class="platform-chip">
          <img src="kick.png" alt="Kick">
          Kick
        </button>
        <button type="button" class="platform-chip">
          <img src="rtmp.png" alt="RTMP">
          RTMP
        </button>
      </div>

      <!-- Поле ввода с кнопкой вставки -->
      <div class="input-wrapper">
        <input 
          type="text" 
          class="input-field" 
          id="streamKeyInput" 
          placeholder="Вставьте ключ потока сюда. ." 
          autocomplete="off"
          spellcheck="false"
        />
        <button type="button" class="paste-btn" id="pasteBtn" title="Вставить из буфера">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          </svg>
          <span id="pasteBtnText">Вставить</span>
        </button>
      </div>

      <button class="submit-button" id="checkBtn">Проверить легитимность</button>

      <div class="security-note">
        <span id="secNote1">Данные не сохраняются</span>
        <span class="dot">•</span>
        <span id="secNote2">Анонимная проверка</span>
      </div>
    </div>

    <!-- Поле вывода результата -->
    <div class="result-box" id="resultBox">
      Результат появится здесь
    </div>
  </main>

  <!-- Интерактивный функционал проверки -->
  <script>
    const checkBtn = document.getElementById('checkBtn');
    const input = document.getElementById('streamKeyInput');
    const resultBox = document.getElementById('resultBox');
    const apiPing = document.getElementById('apiPing');
    const langBtn = document.getElementById('langBtn');
    const langCode = document.getElementById('langCode');

    let currentLang = 'ru';
    let isVpnDetected = false;
    let hasCustomResult = false;

    const translations = {
      ru: {
        pageTitle: 'STREAMGUARD — Проверка ключа потока',
        title: 'Проверка ключа потока',
        subtitle: 'Вставьте ключ потока и проверьте легитимность',
        placeholder: 'Вставьте ключ потока сюда. .',
        pasteBtn: 'Вставить',
        checkBtn: 'Проверить легитимность',
        secNote1: 'Данные не сохраняются',
        secNote2: 'Анонимная проверка',
        resultDefault: 'Результат появится здесь',
        emptyKey: 'Введите ключ потока для проверки!',
        queueMsg: (pos) => `В очереди запросов: <span style="color:#ffffff; font-weight:600;">${pos}</span> чел. Ожидание сервера...`,
        processingMsg: 'Обработка запроса: валидация ключа в сети...',
        validKey: 'Ключ легитимен <span style="color: #4ade80;">✔ [STATUS: VERIFIED & ACTIVE]</span>',
        invalidKey: 'Некорректный формат ключа <span style="color: #f87171;">✖ [STATUS: INVALID]</span>'
      },
      en: {
        pageTitle: 'STREAMGUARD — Stream Key Verification',
        title: 'Stream Key Verification',
        subtitle: 'Insert stream key to verify legitimacy',
        placeholder: 'Paste stream key here. .',
        pasteBtn: 'Paste',
        checkBtn: 'Verify Legitimacy',
        secNote1: 'Data is not saved',
        secNote2: 'Anonymous verification',
        resultDefault: 'Result will appear here',
        emptyKey: 'Please enter a stream key to check!',
        queueMsg: (pos) => `In request queue: <span style="color:#ffffff; font-weight:600;">${pos}</span> users. Waiting for server...`,
        processingMsg: 'Processing request: validating key on network...',
        validKey: 'Key is legitimate <span style="color: #4ade80;">✔ [STATUS: VERIFIED & ACTIVE]</span>',
        invalidKey: 'Invalid stream key format <span style="color: #f87171;">✖ [STATUS: INVALID]</span>'
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];
      document.title = t.pageTitle;
      document.documentElement.lang = lang;

      document.getElementById('mainTitle').textContent = t.title;
      document.getElementById('mainSubtitle').textContent = t.subtitle;
      document.getElementById('pasteBtnText').textContent = t.pasteBtn;
      document.getElementById('pasteBtn').title = lang === 'ru' ? 'Вставить из буфера' : 'Paste from clipboard';
      document.getElementById('checkBtn').textContent = t.checkBtn;
      input.placeholder = t.placeholder;
      document.getElementById('secNote1').textContent = t.secNote1;
      document.getElementById('secNote2').textContent = t.secNote2;
      langCode.textContent = lang.toUpperCase();

      if (!hasCustomResult) {
        resultBox.textContent = t.resultDefault;
      }
    }

    // Переключение языка по клику на глобус
    langBtn.addEventListener('click', () => {
      const nextLang = currentLang === 'ru' ? 'en' : 'ru';
      localStorage.setItem('sg_lang', nextLang);
      setLanguage(nextLang);
    });

    // Динамический замер и смена пинга раз в 4 секунды (с учётом VPN)
    function updatePing() {
      apiPing.style.opacity = '0.35';
      setTimeout(() => {
        let newPing;
        if (isVpnDetected) {
          // При включенном VPN задержка ощутимо выше
          const spike = Math.random() < 0.25 ? Math.floor(Math.random() * 40) : 0;
          newPing = Math.floor(115 + Math.random() * 45) + spike;
          apiPing.textContent = `${newPing}ms (VPN)`;
        } else {
          // Обычный прямой пинг
          const spike = Math.random() < 0.15 ? Math.floor(Math.random() * 16) : 0;
          newPing = Math.floor(13 + Math.random() * 10) + spike;
          apiPing.textContent = `${newPing}ms`;
        }
        apiPing.style.opacity = '1';
      }, 400);
    }
    setInterval(updatePing, 4000);

    // Определение страны по IP и проверка на VPN
    async function initGeoAndNetwork() {
      let country = null;
      let ipTimezone = null;
      let org = '';

      try {
        const res = await fetch('https://ipwho.is/', { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data && data.success) {
            country = data.country_code;
            ipTimezone = data.timezone ? data.timezone.id : null;
            org = (data.connection ? (data.connection.isp + ' ' + data.connection.org) : '').toLowerCase();
          }
        }
      } catch (e) {}

      if (!country) {
        try {
          const res = await fetch('https://api.country.is/', { cache: 'no-store' });
          if (res.ok) {
            const data = await res.json();
            country = data.country;
          }
        } catch (e) {}
      }

      // Признаки VPN
      const clientTz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
      const clientLangs = navigator.languages ? navigator.languages.join(',') : (navigator.language || '');
      const isClientRu = /Europe\/(Moscow|Samara|Kaliningrad|Volgograd|Saratov)|Asia\/(Yekaterinburg|Omsk|Novosibirsk|Krasnoyarsk|Irkutsk|Yakutsk|Vladivostok)/i.test(clientTz) || /ru/i.test(clientLangs);

      const vpnKeywords = ['vpn', 'hosting', 'datacenter', 'm247', 'datacamp', 'digitalocean', 'ovh', 'hetzner', 'linode', 'vultr', 'choopa', 'fastly', 'leaseweb', 'psychz', 'contabo', 'proton', 'nord', 'surfshark', 'mullvad', 'expressvpn', 'cloud'];
      const orgMatchesVpn = vpnKeywords.some(kw => org.includes(kw));

      // Если IP не RU, но система/локаль явно из РФ — типичный зарубежный VPN
      if (country && country !== 'RU' && isClientRu) {
        isVpnDetected = true;
      } else if (orgMatchesVpn) {
        isVpnDetected = true;
      } else if (ipTimezone && clientTz && ipTimezone !== clientTz) {
        isVpnDetected = true;
      }

      // Применение языка: сохранённый выбор пользователя либо автоопределение по стране IP
      const savedLang = localStorage.getItem('sg_lang');
      if (savedLang && (savedLang === 'ru' || savedLang === 'en')) {
        setLanguage(savedLang);
      } else {
        if (country === 'RU') {
          setLanguage('ru');
        } else {
          setLanguage('en');
        }
      }

      updatePing();
    }
    initGeoAndNetwork();

    // Вспомогательная функция задержки
    const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    checkBtn.addEventListener('click', async () => {
      const key = input.value.trim();
      const t = translations[currentLang];

      if (!key) {
        resultBox.textContent = t.emptyKey;
        resultBox.style.color = '#f87171';
        resultBox.style.borderColor = 'rgba(248, 113, 113, 0.4)';
        hasCustomResult = true;
        return;
      }

      checkBtn.disabled = true;
      checkBtn.style.opacity = '0.7';
      resultBox.style.color = 'var(--yellow)';
      resultBox.style.borderColor = 'var(--yellow)';
      hasCustomResult = true;

      // Распределение очереди
      const rand = Math.random();
      let queueSize = 0;
      if (rand > 0.45 && rand <= 0.90) {
        queueSize = Math.floor(Math.random() * 3) + 1;
      } else if (rand > 0.90) {
        queueSize = Math.floor(Math.random() * 2) + 4;
      }

      // Симуляция ожидания в очереди
      if (queueSize > 0) {
        for (let pos = queueSize; pos > 0; pos--) {
          resultBox.innerHTML = t.queueMsg(pos);
          await wait(600 + Math.floor(Math.random() * 400));
        }
      }

      resultBox.textContent = t.processingMsg;
      await wait(750);

      checkBtn.disabled = false;
      checkBtn.style.opacity = '1';

      if (key.length >= 12) {
        resultBox.innerHTML = t.validKey;
        resultBox.style.color = '#4ade80';
        resultBox.style.borderColor = 'rgba(74, 222, 128, 0.5)';
      } else {
        resultBox.innerHTML = t.invalidKey;
        resultBox.style.color = '#f87171';
        resultBox.style.borderColor = 'rgba(248, 113, 113, 0.5)';
      }
    });

    // Запуск проверки по нажатию Enter
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        checkBtn.click();
      }
    });

    // Кнопка вставки из буфера обмена
    const pasteBtn = document.getElementById('pasteBtn');
    pasteBtn.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          input.value = text;
          input.focus();
        }
      } catch (err) {
        input.focus();
      }
    });

    // Переключение активной платформы
    document.querySelectorAll('.platform-chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.platform-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
      });
    });
  </script>
</body>
</html>
